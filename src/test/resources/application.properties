# Testerna kör mot en H2-databas i minnet (MySQL-läge) istället för MySQL
spring.datasource.url=jdbc:h2:mem:finance;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
