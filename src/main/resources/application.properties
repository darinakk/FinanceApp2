spring.application.name=finance2

# Databasen styrs med miljövariabler. Standardvärdena matchar docker-compose.yml.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finance_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:finance}

# schema.sql bygger om tabellerna vid varje start (demoläge), Hibernate rör inte schemat
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
